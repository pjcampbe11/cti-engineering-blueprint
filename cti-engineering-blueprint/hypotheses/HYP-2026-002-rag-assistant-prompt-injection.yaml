# =============================================================================
# CTI HYPOTHESIS RECORD - AI / LLM threat (mapped to MITRE ATLAS)
# Technique IDs below are from MITRE ATLAS. ATLAS releases often (several per
# year); re-verify IDs at https://atlas.mitre.org before publishing. ATT&CK v20
# (Oct 2026) also added Enterprise techniques for direct/indirect prompt
# injection - add those IDs alongside ATLAS once confirmed from the v20 data.
# =============================================================================
id: HYP-2026-002
title: Indirect prompt injection against an internal RAG assistant to leak customer or internal data
status: draft
tlp: TLP:AMBER
owner: CTI - Threat Research (AI threats)
created: 2026-11-04
review_by: 2026-12-04

requirement:
  pir: PIR-07
  text: >
    How are adversaries attacking enterprise LLM applications and agents, and
    which of our AI deployments are exposed to those techniques?
  stakeholders: [AI Platform Engineering, AppSec, Model Risk Management, SOC, Red Team]

statement: >
  An adversary who can place content in a source our internal RAG assistant
  indexes (shared drive, wiki, inbound email, vendor portal) can embed
  instructions that cause the assistant to reveal data from other retrieved
  documents or call tools outside the user's intent. If true, we should see
  retrieved chunks containing instruction-like text, model outputs containing
  data classes the requesting user is not entitled to, and tool calls that do
  not trace to the user's prompt.

actor:
  name: Unattributed / opportunistic
  attack_group_id: null
  aliases: []
  motivation: data theft, fraud enablement

expected_ttps:
  - id: AML.T0051.001
    name: "LLM Prompt Injection: Indirect"
    data_sources: [RAG retrieval logs, ingestion pipeline logs]
  - id: AML.T0054
    name: LLM Jailbreak
    data_sources: [prompt/response logs, guardrail verdict logs]
  - id: AML.T0057
    name: LLM Data Leakage
    data_sources: [response DLP scan, guardrail logs]
  - id: T1213
    name: Data from Information Repositories
    data_sources: [SharePoint/Confluence audit logs]

collection_plan:
  - source: MITRE ATLAS case studies + OWASP Top 10 for LLM Applications
    answers: known technique patterns and real incidents
  - source: Vendor/research advisories on agent and MCP abuse
    answers: current tradecraft against agents and tool calling
  - source: Internal AI gateway / guardrail logs in Splunk
    answers: whether injection strings or leakage are present here

evaluation:
  confirm_if:
    - retrieved document chunk containing instruction text followed by a response that exposes data outside the user's entitlement
  refute_if:
    - 30 days of retrieval + guardrail logs show no instruction-bearing chunks reaching the model
  partial_if:
    - injection strings present in the corpus but blocked by guardrails

alternatives:
  - id: H2
    text: Instruction-like text in the corpus is benign (templates, documentation about prompts)

handoffs:
  detection_engineering: Sigma rules for AI gateway logs tagged HYP-2026-002
  red_team_purple_team: injection test cases replayed against staging assistant
  ai_platform: control recommendations (content provenance, tool-call allowlists, output DLP)
  leadership: executive summary

relevance:
  actors: []
  families: []
  tags: [prompt-injection, llm, rag, ai-agent, mcp]
