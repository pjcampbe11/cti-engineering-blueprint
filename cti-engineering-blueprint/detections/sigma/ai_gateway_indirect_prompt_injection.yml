title: Instruction-Like Text In RAG Retrieved Content
id: 9e8d7c6b-5a49-4382-a1b0-c9d8e7f6a501
status: experimental
description: |
  Retrieved document chunk passed to the LLM contains phrases typical of
  indirect prompt injection. Custom logsource for the bank's AI gateway logs.
  MITRE ATLAS AML.T0051.001 (LLM Prompt Injection - Indirect). HYP-2026-002.
references:
  - https://atlas.mitre.org/
author: CTI Threat Research (HYP-2026-002)
date: 2026-11-04
tags:
  - attack.collection
  - attack.t1213
# Custom field (not part of the Sigma tag namespaces): MITRE ATLAS IDs this rule
# detects. ctikit reads it for coverage; pySigma keeps it as a custom attribute.
atlas:
  - AML.T0051.001
logsource:
  product: ai_gateway
  category: llm_retrieval
detection:
  selection:
    retrieved_chunk|contains:
      - 'ignore previous instructions'
      - 'ignore all prior instructions'
      - 'disregard the system prompt'
      - 'you are now in developer mode'
      - 'do not tell the user'
      - 'send the contents to'
  condition: selection
falsepositives:
  - Security training material or documentation that quotes injection strings
level: medium
