title: Okta Verify Push Denied By User
id: 7a1e9c44-2b3d-4f8a-a6c1-9d0e2b4f6a21
name: okta_push_denied
status: experimental
description: Base rule - a user denied an Okta Verify push (MFA fatigue signal). Feeds the correlation below. HYP-2026-001.
references:
  - https://attack.mitre.org/techniques/T1621/
author: CTI Threat Research (HYP-2026-001)
date: 2026-11-04
tags:
  - attack.credential-access
  - attack.t1621
logsource:
  product: okta
  service: okta
detection:
