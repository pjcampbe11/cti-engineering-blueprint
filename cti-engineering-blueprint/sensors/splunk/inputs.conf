# Splunk Universal Forwarder inputs for the custom sensor layer.

# Windows Sysmon (native or standalone - same channel). Use the Splunk Add-on
# for Sysmon for field extractions and CIM mapping.
[WinEventLog://Microsoft-Windows-Sysmon/Operational]
disabled = 0
renderXml = true
index = edr_custom
sourcetype = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational

# Linux auditd
[monitor:///var/log/audit/audit.log]
disabled = 0
index = linux_audit
sourcetype = linux:audit

# Sysmon for Linux writes to syslog; filter at the forwarder/pipeline to the sysmon program name
[monitor:///var/log/syslog]
disabled = 0
index = linux_os
sourcetype = syslog

# osquery differential results (filesystem logger)
[monitor:///var/log/osquery/osqueryd.results.log]
disabled = 0
index = linux_osquery
sourcetype = osquery:results
