{
  "_comment": "osquery pack for hosts without EDR. Differential results ship to the SIEM via the osquery logger (filesystem -> UF, or tls/kafka). Each query names its ATT&CK technique.",
  "queries": {
    "listening_ports": {
      "query": "SELECT p.name, p.path, p.cmdline, l.port, l.address, l.protocol FROM listening_ports l JOIN processes p USING (pid) WHERE l.address NOT IN ('127.0.0.1','::1');",
      "interval": 3600, "description": "T1571 / exposed services"
    },
    "authorized_keys": {
      "query": "SELECT u.username, k.key_file, k.algorithm, k.key FROM users u CROSS JOIN authorized_keys k USING (uid);",
      "interval": 3600, "description": "T1098.004 SSH key persistence"
    },
    "crontab": {
      "query": "SELECT * FROM crontab;", "interval": 3600, "description": "T1053.003 cron persistence"
    },
    "suid_binaries": {
      "query": "SELECT path, username, permissions FROM suid_bin;", "interval": 86400,
      "description": "T1548.001 setuid abuse"
    },
    "process_open_sockets_external": {
      "query": "SELECT p.name, p.path, p.cmdline, s.remote_address, s.remote_port FROM process_open_sockets s JOIN processes p USING (pid) WHERE s.remote_address NOT IN ('', '0.0.0.0', '127.0.0.1', '::', '::1') AND s.remote_port > 0;",
      "interval": 300, "description": "T1071 outbound connections - join remote_address to the TIP lookup in the SIEM"
    },
    "deleted_running_binaries": {
      "query": "SELECT pid, name, path, cmdline FROM processes WHERE on_disk = 0;",
      "interval": 300, "description": "T1070.004 binary deleted after execution"
    }
  }
}
